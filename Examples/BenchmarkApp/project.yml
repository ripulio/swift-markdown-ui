name: MarkdownBenchmark
options:
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
packages:
  MarkdownUI:
    path: ../..
settings:
  base:
    SWIFT_VERSION: '5.9'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  MarkdownBenchmark:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [BenchmarkCorpus.swift, BenchmarkApp.swift]
    dependencies:
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ripul.examples.markdown-benchmark
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
schemes:
  MarkdownBenchmark:
    build:
      targets:
        MarkdownBenchmark: all
