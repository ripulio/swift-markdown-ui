name: Format
on:
  workflow_dispatch:
jobs:
  format:
    name: swift-format
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: make format
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Run swift format
          branch: ripul
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
